<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">MiniDashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
    <div class="page">
        <header class="navbar navbar-expand-md d-print-none">
            <div class="container-xl">
                <h1 class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pr-0 pr-md-3">
                    <i class="ti ti-layout-dashboard me-2 text-success"></i>
                    <span id="brand-title">MiniDashboard</span>
                </h1>

                <div class="navbar-nav flex-row order-md-last">
                    <button
                        class="btn btn-icon btn-ghost-secondary me-1"
                        id="settings-toggle"
                        data-bs-toggle="tooltip"
                        data-bs-placement="bottom"
                        title="Settings"
                        type="button">
                        <i class="ti ti-pencil fs-2"></i>
                    </button>

                    <button
                        class="btn btn-icon btn-ghost-secondary"
                        id="theme-toggle"
                        data-bs-toggle="tooltip"
                        data-bs-placement="bottom"
                        title="Toggle theme"
                        type="button">
                        <i class="ti ti-sun fs-2 d-none" id="theme-icon-sun"></i>
                        <i class="ti ti-moon fs-2" id="theme-icon-moon"></i>
                    </button>
                </div>
            </div>
        </header>

        <div class="page-wrapper">
            <div class="page-body">
                <div class="container-xl">
                    <div id="dashboard-container" class="row row-cards">
                        <!-- Dashboard content -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings modal -->
    <div class="modal modal-blur fade" id="modal-settings" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">General Settings</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Dashboard title</label>
                        <input
                            type="text"
                            class="form-control"
                            id="setting-title"
                            placeholder="e.g. MiniDashboard">
                    </div>

                    <div class="mb-3">
                        <label class="form-check form-switch cursor-pointer">
                            <input class="form-check-input" type="checkbox" id="setting-show-urls">
                            <span class="form-check-label">Show URLs on tiles</span>
                        </label>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="button" class="btn btn-primary ms-auto" id="settings-save">
                        Save
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Group modal -->
    <div class="modal modal-blur fade" id="modal-group" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-group-title">Edit group</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="group-id">

                    <div class="mb-3">
                        <label class="form-label">Group name</label>
                        <input
                            type="text"
                            class="form-control"
                            id="group-name"
                            placeholder="e.g. Infrastructure">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="button" class="btn btn-primary ms-auto" id="group-save">
                        Save
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tile modal -->
    <div class="modal modal-blur fade" id="modal-tile" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-tile-title">Edit tile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="tile-group-id">
                    <input type="hidden" id="tile-id">

                    <div class="mb-3">
                        <label class="form-label">Group</label>
                        <select class="form-select" id="tile-group-select"></select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input
                            type="text"
                            class="form-control"
                            id="tile-title"
                            placeholder="e.g. OpenMediaVault">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">URL</label>
                        <input
                            type="text"
                            class="form-control"
                            id="tile-url"
                            placeholder="http://192.0.2.x:80">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Select a local icon</label>
                        <select class="form-select" id="tile-icon-select">
                            <option value="">-- Select local icon --</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Icon name (self-hosted icons)</label>

                        <div class="input-group">
                            <input
                                type="text"
                                class="form-control"
                                id="tile-icon-custom"
                                placeholder="e.g. grafana or proxmox">

                            <button
                                class="btn btn-outline-secondary"
                                type="button"
                                id="icon-fetch">
                                <i class="ti ti-download me-1"></i>
                                Fetch
                            </button>
                        </div>

                        <small class="form-hint">
                            Fetches the icon from the configured icon source and stores it locally.
                        </small>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="button" class="btn btn-primary ms-auto" id="tile-save">
                        Save
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
